<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Кейс Лаб</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <div id="loader"><div class="spinner"></div></div>

  <div id="app">
    <header id="hdr">
      <button class="logo" data-act="nav" data-id="cases"><span class="logo-mark"></span><span class="logo-text" data-i18n="title"></span></button>
      <nav class="topnav">
        <button data-act="nav" data-id="inv" data-i18n="nav_inv"></button>
        <button data-act="nav" data-id="cases" data-i18n="nav_cases"></button>
        <button data-act="nav" data-id="upgrade" data-i18n="nav_upgrade"></button>
        <button data-act="nav" data-id="rewards" data-i18n="nav_rewards"></button>
        <button data-act="nav" data-id="farm" data-i18n="nav_farm"></button>
      </nav>
      <div class="hdr-right">
        <div class="bal"><i class="ci"></i><span id="bal">0</span></div>
        <button class="hbtn plus" data-act="nav" data-id="farm" aria-label="farm">+</button>
        <button class="hbtn desk" data-act="bg-pick" aria-label="background">🖼</button>
        <button class="hbtn" id="btn-sound" data-act="sound" aria-label="sound">🔊</button>
        <button class="hdr-user" data-act="nav" data-id="profile" aria-label="profile">
          <span class="hdr-name" id="hdr-name"></span>
          <span class="avatar" id="ava-btn"><img id="ava-img" alt=""><span id="ava-letter"></span></span>
        </button>
      </div>
    </header>

    <div id="body">
      <aside id="feed">
        <div class="feed-head">
          <div class="feed-title"><i class="live"></i><span id="feed-title"></span></div>
          <div class="feed-tabs">
            <button class="on" data-act="feed" data-id="all" data-i18n="feed_all"></button>
            <button data-act="feed" data-id="top" data-i18n="feed_hot"></button>
          </div>
        </div>
        <div id="feed-list"></div>
      </aside>

      <main id="main">
        <!-- Кейсы -->
        <section class="screen" id="scr-cases">
          <div class="search"><input id="case-search" type="text" autocomplete="off" data-i18n-ph="search"></div>
          <div id="case-sections"></div>
        </section>

        <!-- Страница кейса -->
        <section class="screen" id="scr-case">
          <button class="btn ghost back" data-act="nav" data-id="cases">← <span data-i18n="back"></span></button>
          <div class="cp-hero">
            <div class="cp-crate" id="cp-crate"></div>
            <h1 id="cp-name"></h1>
          </div>
          <div id="cp-rolls"></div>
          <div class="cp-controls">
            <div class="cp-count" id="cp-count"></div>
            <button class="btn primary big" id="cp-open" data-act="open"></button>
            <button class="btn good big" id="cp-open-free" data-act="open-free" data-lock="1" data-i18n="open_free"></button>
            <button class="btn ad big" id="cp-open-ad" data-act="open-ad"></button>
            <button class="btn toggle" id="cp-fast" data-act="fast" data-lock="1">⚡ <span data-i18n="fast"></span></button>
          </div>
          <h2 class="sec-h small" data-i18n="contents"></h2>
          <div class="item-grid" id="cp-contents"></div>
        </section>

        <!-- Инвентарь -->
        <section class="screen" id="scr-inv">
          <div class="panel inv-bar">
            <div class="inv-sum">
              <small data-i18n="inv_worth"></small>
              <b><i class="ci"></i><span id="inv-worth">0</span></b>
              <small id="inv-count"></small>
            </div>
            <div class="inv-tools">
              <select id="inv-sort">
                <option value="new" data-i18n="sort_new"></option>
                <option value="desc" data-i18n="sort_desc"></option>
                <option value="asc" data-i18n="sort_asc"></option>
                <option value="rar" data-i18n="sort_rar"></option>
              </select>
              <button class="btn" data-act="sell-low" data-i18n="sell_low"></button>
              <button class="btn primary" data-act="sell-all" data-i18n="sell_all"></button>
            </div>
          </div>
          <div class="item-grid" id="inv-grid"></div>
        </section>

        <!-- Апгрейд -->
        <section class="screen" id="scr-upgrade">
          <div class="up-top">
            <div class="panel up-panel">
              <div class="up-ph"><span data-i18n="up_stake"></span><button class="btn mini" data-act="up-clear-stake" data-i18n="up_clear"></button></div>
              <div class="up-slot" id="up-stake"></div>
              <div class="up-bal">
                <span data-i18n="up_balance"></span>
                <input type="range" id="up-bal-range" min="0" max="0" step="0.01" value="0">
                <b><i class="ci"></i><span id="up-bal-val">0</span></b>
              </div>
              <div class="up-sum" id="up-sum"></div>
            </div>
            <div class="up-center">
              <div class="up-tools">
                <button class="btn toggle mini" id="up-fast" data-act="fast" data-lock="1">⚡ <span data-i18n="up_turbo"></span></button>
              </div>
              <div class="up-ring" id="up-ring">
                <svg viewBox="0 0 200 200" aria-hidden="true">
                  <defs>
                    <radialGradient id="up-disc" cx="50%" cy="38%" r="65%">
                      <stop offset="0" stop-color="#262e41"/><stop offset="1" stop-color="#10141d"/>
                    </radialGradient>
                    <linearGradient id="up-arc-g" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#5df0a0"/><stop offset="1" stop-color="#22b866"/>
                    </linearGradient>
                  </defs>
                  <path id="up-ticks" d="" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.3"/>
                  <circle cx="100" cy="100" r="80" fill="none" stroke="#1b2131" stroke-width="12"/>
                  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,84,104,.16)" stroke-width="12"/>
                  <path id="up-arc" d="" fill="none" stroke="url(#up-arc-g)" stroke-width="12"/>
                  <circle cx="100" cy="100" r="70" fill="url(#up-disc)" stroke="#2c3448" stroke-width="1.5"/>
                  <circle cx="100" cy="100" r="61" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
                  <g id="up-ptr"><path d="M100,30 L92.5,12 Q100,15.5 107.5,12 Z" fill="#ffc04d" stroke="#6b3d00" stroke-width="1.2" stroke-linejoin="round"/></g>
                </svg>
                <div class="up-ring-txt"><b id="up-chance">0.00%</b><small data-i18n="up_chance"></small><span id="up-mult"></span></div>
              </div>
              <button class="btn primary big" id="up-go" data-act="up-go" data-i18n="up_btn"></button>
            </div>
            <div class="panel up-panel">
              <div class="up-ph"><span data-i18n="up_target"></span><button class="btn mini" data-act="up-clear-target" data-i18n="up_clear"></button></div>
              <div class="up-slot" id="up-target"></div>
              <div class="up-quick">
                <button class="btn mini" data-act="up-quick" data-id="x1.5">×1.5</button>
                <button class="btn mini" data-act="up-quick" data-id="x2">×2</button>
                <button class="btn mini" data-act="up-quick" data-id="x5">×5</button>
                <button class="btn mini" data-act="up-quick" data-id="x10">×10</button>
                <button class="btn mini" data-act="up-quick" data-id="p75">75%</button>
                <button class="btn mini" data-act="up-quick" data-id="p50">50%</button>
                <button class="btn mini" data-act="up-quick" data-id="p25">25%</button>
              </div>
            </div>
          </div>
          <div class="up-lists">
            <div class="panel">
              <div class="up-lh">
                <span data-i18n="up_my_items"></span>
                <select id="up-sort">
                  <option value="desc" data-i18n="sort_desc"></option>
                  <option value="asc" data-i18n="sort_asc"></option>
                  <option value="new" data-i18n="sort_new"></option>
                </select>
              </div>
              <div class="item-grid small scroll" id="up-inv"></div>
            </div>
            <div class="panel">
              <div class="up-lh">
                <span data-i18n="up_pick"></span>
                <input id="up-search" type="text" autocomplete="off" data-i18n-ph="up_search">
                <input id="up-min" type="number" min="0" data-i18n-ph="up_from">
                <input id="up-max" type="number" min="0" data-i18n-ph="up_to">
              </div>
              <div class="item-grid small" id="up-cat"></div>
              <div class="pager">
                <button class="btn mini" data-act="up-page" data-id="-1">‹</button>
                <span id="up-page"></span>
                <button class="btn mini" data-act="up-page" data-id="1">›</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Фарм -->
        <section class="screen" id="scr-farm">
          <div class="farm">
            <div class="panel farm-coin">
              <div class="farm-stats"><span class="pill" id="farm-click"></span><span class="pill" id="farm-income"></span></div>
              <button id="big-coin" class="big-coin" aria-label="coin"><span class="bc-ring"></span><span class="bc-star">★</span></button>
              <div class="tap-hint" id="tap-hint" data-i18n="tap_hint"></div>
            </div>
            <div class="farm-side">
              <div class="bonus">
                <div class="b-ico">🧰</div>
                <div class="b-txt"><b data-i18n="free_case"></b><small id="free-sub"></small></div>
                <button class="btn primary" id="btn-free" data-act="free-case"></button>
              </div>
              <div class="bonus">
                <div class="b-ico">📺</div>
                <div class="b-txt"><b data-i18n="ad_coins"></b><small data-i18n="ad_coins_sub"></small></div>
                <button class="btn ad" id="btn-adcoins" data-act="ad-coins"></button>
              </div>
              <h2 class="sec-h small" data-i18n="shop"></h2>
              <div id="shop-list"></div>
            </div>
          </div>
        </section>

        <!-- Награды -->
        <section class="screen" id="scr-rewards">
          <div class="panel rw-daily">
            <div class="rw-dh">
              <div class="rw-dt"><h2 class="rw-h">🎁 <span data-i18n="daily"></span></h2><small id="daily-sub"></small></div>
              <button class="btn primary big" id="btn-daily" data-act="daily"></button>
            </div>
            <div class="rw-days" id="rw-days"></div>
          </div>
          <h2 class="sec-h small" data-i18n="rw_timed"></h2>
          <div class="rw-grid" id="rw-timed"></div>
          <div class="rw-qh"><h2 class="sec-h small" data-i18n="rw_quests"></h2><small id="rw-q-reset"></small></div>
          <div class="rw-quests" id="rw-quests"></div>
        </section>

        <!-- Профиль -->
        <section class="screen" id="scr-profile">
          <div class="prof-top">
            <div class="panel prof-card">
              <div class="prof-head">
                <div class="prof-ava"><img id="prof-img" alt=""><span id="prof-letter"></span></div>
                <div class="prof-id"><b id="prof-name"></b><small id="prof-cloud"></small></div>
              </div>
              <div class="prof-bal"><small data-i18n="balance"></small><b><i class="ci"></i><span id="prof-bal">0</span></b></div>
              <div class="prof-btns">
                <button class="btn primary" data-act="nav" data-id="farm">+ <span data-i18n="nav_farm"></span></button>
                <button class="btn" data-act="edit-profile">✏️ <span data-i18n="edit_profile"></span></button>
                <button class="btn" data-act="settings">⚙️ <span data-i18n="settings"></span></button>
              </div>
            </div>
            <div class="panel prof-best"><small data-i18n="best_drop"></small><div id="prof-best"></div></div>
            <div class="panel prof-stats" id="prof-stats"></div>
          </div>
          <h2 class="sec-h" data-i18n="collection"></h2>
          <div class="panel col-head">
            <div id="col-progress"></div>
            <div class="bar"><div class="bar-fill" id="col-bar"></div></div>
            <small id="col-bonus"></small>
          </div>
          <div id="col-list"></div>
        </section>
      </main>
    </div>

    <nav id="tabbar">
      <button data-act="nav" data-id="cases"><span>📦</span><small data-i18n="nav_cases"></small></button>
      <button data-act="nav" data-id="inv"><span>🎒</span><small data-i18n="nav_inv"></small></button>
      <button data-act="nav" data-id="upgrade"><span>⏫</span><small data-i18n="nav_upgrade"></small></button>
      <button data-act="nav" data-id="rewards"><span>🎁</span><small data-i18n="nav_rewards"></small></button>
      <button data-act="nav" data-id="farm"><span>💰</span><small data-i18n="nav_farm"></small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script>window.CASELAB_NO_SDK = true;</script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art_geo.js"></script>
  <script src="js/art_tex.js"></script>
  <script src="js/art.js"></script>
  <script src="js/bg.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scr_cases.js"></script>
  <script src="js/scr_inv.js"></script>
  <script src="js/scr_upgrade.js"></script>
  <script src="js/scr_farm.js"></script>
  <script src="js/scr_profile.js"></script>
  <script src="js/scr_rewards.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
